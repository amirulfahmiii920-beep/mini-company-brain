# Lint, format check and tests on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway CI database credentials. They only exist inside this job's
    # private service container, so they are not secrets.
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: mcb_ci
      POSTGRES_PORT: "5432"

    services:
      db:
        # Same image as docker-compose.yml, so CI tests the versions we run locally.
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          # config.py connects to 127.0.0.1, so publish the port on the runner.
          - 5432:5432
        # Steps start only after Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U ci -d mcb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GitHub token in .git/config for later steps.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The embedding model (about 70 MB) never changes for a given model name,
      # so the key is fixed. Bump the suffix to force a fresh download.
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-v1

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Run tests
        run: uv run --locked pytest
